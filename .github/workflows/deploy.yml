name: Deploy Portfolio & Resume

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 3. Install Node Dependencies & Build Tailwind CSS
        run: |
          npm ci
          npm run build:css

      - name: 4. Setup Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 5. Install ReportLab & Generate Vector Resume PDF
        run: |
          pip install -r requirements.txt
          python generate_pdf.py

      - name: 6. Verify Production Artifacts
        run: |
          if [ ! -s output.css ]; then
            echo "::error::output.css was not generated or is empty"
            exit 1
          fi
          if [ ! -s Ammar_resume.pdf ]; then
            echo "::error::Ammar_resume.pdf was not generated or is empty"
            exit 1
          fi
          echo "Verified: output.css ($(wc -c < output.css) bytes) and Ammar_resume.pdf ($(wc -c < Ammar_resume.pdf) bytes) successfully built!"

      - name: 7. Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 8. Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 9. Deploy Live to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
